<?xml version="1.0" encoding="UTF-8"?>

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Form response</title>
    <style type="text/css">
        @page {
            size: Letter;
            margin: 10mm 10.6mm 14mm 10.6mm;
            @bottom-left { content: "Submitted form response"; font: 8pt Helvetica, Arial, sans-serif; color: #6b7280; }
            @bottom-right { content: "Page " counter(page) " of " counter(pages); font: 8pt Helvetica, Arial, sans-serif; color: #6b7280; }
        }
        body { font-family: Carlito, Calibri, Helvetica, Arial, sans-serif; font-size: 10.5pt; line-height: 1.5; color: #14262e; }
        div.b { margin: 0; white-space: pre-wrap; }
        div.empty { height: 5pt; line-height: 5pt; }
        div.b-h1 { font-size: 2em; font-weight: bold; line-height: 1.25; margin: 4pt 0 2pt 0; }
        div.b-h2 { font-size: 1.5em; font-weight: bold; line-height: 1.25; margin: 2pt 0 4pt 0; }
        div.b-h3 { font-size: 1.17em; font-weight: bold; line-height: 1.4; margin: 2pt 0 2pt 0; }
        div.b-blockquote { padding-left: 9pt; border-left: 3pt solid #d9e2e7; }
        div.b-li { padding-left: 14pt; }
        hr.divider { border: 0; border-top: 1px solid #d9e2e7; margin: 6pt 0; }
        div.page-break { height: 0; page-break-after: always; }


        span.val { display: inline-block; padding: 0 3pt; font-size: 11pt; white-space: pre-wrap; border-bottom: 0.75pt solid #8c8c8c; vertical-align: bottom; }
        span.opts { display: inline-block; vertical-align: top; }
        span.opt { display: inline-block; margin: 0 14pt 0 0; white-space: nowrap; }
        span.cb { display: inline-block; width: 8pt; height: 8pt; margin-right: 3pt; border: 0.75pt solid #14262e;
            font-size: 7.5pt; line-height: 8pt; font-weight: bold; text-align: center; vertical-align: middle; }


        div.sig { display: block; margin: 2pt 0; white-space: normal; }
        img.sig { height: 28pt; border-bottom: 0.75pt solid #8c8c8c; }
        div.sig-empty { height: 28pt; width: 210pt; border-bottom: 0.75pt solid #8c8c8c; }
        div.field { display: block; margin: 4pt 0; page-break-inside: avoid; white-space: normal; }
        div.center { text-align: center; }
        img.diagram { border: 0; }
        p.legend { white-space: pre-line; margin: 2pt 0 0 0; font-size: 8.5pt; line-height: 1.3; color: #52646d; }


        table.grid { width: 100%; border-collapse: collapse; -fs-table-paginate: paginate; font-size: 9.5pt; line-height: 1.4; }
        table.grid th, table.grid td { border: 0.75pt solid #8c8c8c; padding: 3pt 5pt; text-align: left; vertical-align: top; }
        table.grid th { background-color: #d9d9d9; }
        table.grid tr { page-break-inside: avoid; }
        table.grid td.tick { text-align: center; }
        table.pair { width: 100%; border-collapse: collapse; }
        table.pair td { vertical-align: top; padding: 0 6pt; }
    </style>
</head>
<body>



<th:block th:each="block : ${blocks}">
    <div th:if="${block.pageBreak}" class="page-break"></div>
    <hr th:if="${block.rule}" class="divider"/>
    <div th:if="${!block.pageBreak and !block.rule}" th:class="${'b b-' + block.tag + (#lists.isEmpty(block.runs) ? ' empty' : '')}" th:style="${block.style}"><th:block th:if="${#lists.isEmpty(block.runs)}">&#160;</th:block><th:block th:each="run : ${block.runs}" th:switch="${run.kind}"><span th:case="'text'" th:style="${run.style}" th:text="${run.text}">Label</span><span th:case="'value'" class="val" th:style="${run.style}" th:text="${run.text}">Answer</span><span th:case="'choices'" class="opts" th:style="${run.style}"><span class="opt" th:each="option : ${run.options}"><span class="cb" th:text="${option.checked} ? 'X' : '&#160;'">X</span><span th:text="${option.label}">Option</span></span></span><div th:case="'signature'" class="sig">
                <img th:if="${run.image != null}" class="sig" th:src="${run.image}" src="" alt="Signature"/>
                <div th:if="${run.image == null}" class="sig-empty">&#160;</div>
            </div><div th:case="'table'" class="field" th:with="grid=${run}">
                <th:block th:replace="~{this :: grid(${grid})}"></th:block>
            </div><div th:case="'diagram'" class="field center" th:with="figure=${run}">
                <th:block th:replace="~{this :: figure(${figure})}"></th:block>
            </div><div th:case="'pair'" class="field">
                <table class="pair">
                    <tr th:if="${!run.vertical}">
                        <td th:each="cell : ${run.cells}" th:style="${cell.style}">
                            <th:block th:replace="~{this :: cell(${cell})}"></th:block>
                        </td>
                    </tr>
                    <tr th:if="${run.vertical}" th:each="cell : ${run.cells}">
                        <td class="center" th:style="${cell.style}">
                            <th:block th:replace="~{this :: cell(${cell})}"></th:block>
                        </td>
                    </tr>
                </table>
            </div></th:block></div>
</th:block>


<th:block th:remove="all">


    <th:block th:fragment="grid(grid)">
        <table class="grid">
            <thead><tr><th th:each="h : ${grid.headers}" th:text="${h}">Column</th></tr></thead>
            <tbody>
            <tr th:each="row : ${grid.rows}">
                <td th:each="cell : ${row}" th:class="${cell.checked != null} ? 'tick' : null">
                    <span th:if="${cell.checked != null}" class="cb" th:text="${cell.checked} ? 'X' : '&#160;'">X</span>
                    <span th:if="${cell.checked == null}" th:text="${cell.text}">Cell</span>
                </td>
            </tr>
            </tbody>
        </table>
    </th:block>


    <th:block th:fragment="figure(figure)">
        <img class="diagram" th:src="${figure.image}" th:style="${figure.style}" src="" alt="Diagram"/>
        <p class="legend" th:if="${figure.legend != null and !#strings.isEmpty(figure.legend)}" th:text="${figure.legend}">1. Neck</p>
    </th:block>



    <th:block th:fragment="cell(cell)">
        <th:block th:if="${cell.kind == 'diagram'}">
            <th:block th:replace="~{this :: figure(${cell})}"></th:block>
        </th:block>
        <th:block th:if="${cell.kind == 'tables'}">
            <div class="field" th:each="grid : ${cell.tables}">
                <th:block th:replace="~{this :: grid(${grid})}"></th:block>
            </div>
        </th:block>
    </th:block>


</th:block>


</body>
</html>
