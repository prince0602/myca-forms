spring.application.name=patient-forms
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.data.redis.repositories.enabled=false
server.port=${PORT:9191}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://keycloak-production-ec5d.up.railway.app/realms/forms-realm
keycloak.client-id=forms-client-web


app.public.rate-limit-per-minute=60
app.public.failure-limit-per-minute=10


# Email
app.email.from=${EMAIL_FROM:noreply@mynxsoftwares.com}
app.environment-url=${APP_ENVIRONMENT_URL:hggg}
aws.accesskey=${AWS_ACCESS_KEY:jhhh}
aws.secretkey=${AWS_SECRET_KEY:hhjhjj}
aws.region= us-east-1
s3.bucket.name=${S3_BUCKET_NAME:/myca-do}
presigned.url.ttl=10
pdf.bundle.ttl=600

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
forms.image.presign-ttl=PT60M


# SMTP (Amazon SES SMTP interface, STARTTLS on 587)
# app.email.provider: smtp (default) or ses (existing SES SDK path)
app.email.provider=${EMAIL_PROVIDER:smtp}
spring.mail.host=${SMTP_HOST:email-smtp.us-east-1.amazonaws.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

app.security.audience=forms-client-web
app.security.allowed-origins=http://localhost:5173,https://oviraforms.netlify.app/,https://ovira-forms.netlify.app/
