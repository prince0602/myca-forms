spring.application.name=${SPRING_APPLICATION_NAME}
spring.flyway.enabled=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.data.redis.repositories.enabled=false
spring.jpa.show-sql=true
server.port=${SERVER_PORT}

aws.accesskey=${AWS_ACCESSKEY}
aws.secretkey=${AWS_SECRETKEY}
aws.region=${AWS_REGION}
s3.bucket.name=${S3_BUCKET_NAME}
presigned.url.ttl=${PRESIGNED_URL_TTL}

tenant.onbording.base.url=${TENANT_ONBOARDING_URL}
# Master Configuration
multitenancy.master.configuration.endpoint=${TENANT_DB_CONFIG_URL}
# Tenant Configuration
multitenancy.tenant.repository.packages=com.mynx.myca500.patient_forms.repository
multitenancy.tenant.entityManager.packages=com.mynx.myca500.patient_forms.entity
multitenancy.tenant.datasource.url-prefix=jdbc:postgresql://${DB_HOST}:5432/
multitenancy.tenant.datasource.hikari.maximumPoolSize=${MULTITENANCY_TENANT_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
multitenancy.tenant.datasource.hikari.minimumIdle=${MULTITENANCY_TENANT_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
multitenancy.tenant.datasource.hikari.idleTimeout=${MULTITENANCY_TENANT_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
multitenancy.tenant.datasource.hikari.keepaliveTime=${MULTITENANCY_TENANT_DATASOURCE_HIKARI_KEEP_ALIVE:300000}