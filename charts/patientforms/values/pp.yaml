global: {}
fullnameOverride: ""
ServiceAccount:
  automountServiceAccountToken: true
  name: patientforms
Deployment:
  name: patientforms
  annotations:
    instrumentation.opentelemetry.io/inject-java: "trace/default"
    vault.security.banzaicloud.io/vault-addr: https://vault.secret-manager.svc.cluster.local:8200
    vault.security.banzaicloud.io/vault-role: vault_access
    vault.security.banzaicloud.io/vault-skip-verify: "true"
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  containers:
    patientforms:
      image:
        registry: "232543634414.dkr.ecr.us-east-1.amazonaws.com"
        repository: "mynx-use1-pp-patient-forms-ecr"
        tag: "snapshot_1.0-SNAPSHOT_MBUG_254_Soap_184c33b"
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 9191
          protocol: TCP
          name: http
      resources:
        limits:
          cpu: "2"
          memory: "4Gi"
        requests:
          cpu: "1"
          memory: "1Gi"
      env:
        SPRING_PROFILES_ACTIVE: vault:namespaced/data/patientforms/patientforms#SPRING_PROFILES_ACTIVE  
        SPRING_APPLICATION_NAME: vault:namespaced/data/patientforms/patientforms#SPRING_APPLICATION_NAME
        SERVER_PORT: vault:namespaced/data/patientforms/patientforms#SERVER_PORT
        AWS_SECRET_ACCESS_KEY: vault:namespaced/data/patientforms/patientforms#AWS_SECRET_ACCESS_KEY
        AWS_ACCESS_KEY_ID: vault:namespaced/data/patientforms/patientforms#AWS_ACCESS_KEY_ID
        S3_BUCKET_NAME: vault:namespaced/data/patientforms/patientforms#S3_BUCKET_NAME
        PRESIGNED_URL_TTL: vault:namespaced/data/patientforms/patientforms#PRESIGNED_URL_TTL
        TENANT_ONBORDING_BASE_URL: vault:namespaced/data/patientforms/patientforms#TENANT_ONBORDING_BASE_URL
        MULTITENANCY_MASTER_CONFIGURATION_ENDPOINT: vault:namespaced/data/patientforms/patientforms#TENANT_DB_CONFIG_URL
        MULTITENANCY_TENANT_REPOSITORY_PACKAGES: vault:namespaced/data/patientforms/patientforms#MULTITENANCY_TENANT_REPOSITORY_PACKAGES
        MULTITENANCY_TENANT_ENTITY_MANAGER_PACKAGES: vault:namespaced/data/patientforms/patientforms#MULTITENANCY_TENANT_ENTITY_MANAGER_PACKAGES
        MULTITENANCY_TENANT_DATASOURCE_URL_PREFIX: vault:namespaced/data/patientforms/patientforms#MULTITENANCY_TENANT_DATASOURCE_URL_PREFIX
        MULTITENANCY_TENANT_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: vault:namespaced/data/patientforms/patientforms#MULTITENANCY_TENANT_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        MULTITENANCY_TENANT_DATASOURCE_HIKARI_MINIMUM_IDLE: vault:namespaced/data/patientforms/patientforms#MULTITENANCY_TENANT_DATASOURCE_HIKARI_MINIMUM_IDLE
        MULTITENANCY_TENANT_DATASOURCE_HIKARI_IDLE_TIMEOUT: vault:namespaced/data/patientforms/patientforms#MULTITENANCY_TENANT_DATASOURCE_HIKARI_IDLE_TIMEOUT
        MULTITENANCY_TENANT_DATASOURCE_HIKARI_KEEP_ALIVE: vault:namespaced/data/patientforms/patientforms#MULTITENANCY_TENANT_DATASOURCE_HIKARI_KEEP_ALIVE
        
Service:
  patientforms:
    name: patientforms
    ports:
      - port: 80
        targetPort: 9191
    sessionAffinity: None
